<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Stremio Reactor — page de test</title>
<link rel="stylesheet" href="../content.css">
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  video { width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<video controls muted></video>
<script>
  document.querySelector('video').src = new URLSearchParams(location.search).get('v') || 'test.mp4';

  // Imite une route du lecteur Stremio (Les Évadés, film).
  if (!location.hash) location.hash = '#/player/abc/x/y/movie/tt0111161/tt0111161';

  // Imite l'API chrome.* de l'extension.
  const store = area => ({
    get(defaults, cb) {
      const saved = JSON.parse(localStorage.getItem('sr-' + area) || '{}');
      cb(Object.assign({}, defaults, saved));
    },
    set(obj) {
      const saved = JSON.parse(localStorage.getItem('sr-' + area) || '{}');
      const changes = {};
      for (const k in obj) changes[k] = { oldValue: saved[k], newValue: obj[k] };
      Object.assign(saved, obj);
      localStorage.setItem('sr-' + area, JSON.stringify(saved));
      listeners.forEach(fn => fn(changes, area));
    }
  });
  const listeners = [];
  window.chrome = {
    runtime: {
      sendMessage(msg, cb) {
        srHandle(msg).then(data => cb({ ok: true, data }), e => cb({ ok: false, error: e.message }));
      }
    },
    storage: { sync: store('sync'), local: store('local'), onChanged: { addListener: fn => listeners.push(fn) } }
  };
</script>
<script src="../lib/net.js"></script>
<script>
  // Hors extension : on passe par le proxy du serveur de test.
  const realFetch = window.fetch.bind(window);
  srFetch = async url => {
    const r = await realFetch('/proxy?url=' + encodeURIComponent(url));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r;
  };
</script>
<script src="../lib/langs.js"></script>
<script src="../content.js"></script>
</body>
</html>
