<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Stremio Reactor</title>
<style>
  body { width: 340px; margin: 0; padding: 14px; background: #141414; color: #ddd; font: 13px "Segoe UI", Roboto, Arial, sans-serif; }
  h1 { font-size: 18px; color: #e50914; margin: 0 0 10px; }
  h2 { font-size: 14px; margin: 14px 0 6px; color: #fff; display: flex; justify-content: space-between; align-items: center; }
  label { display: flex; justify-content: space-between; align-items: center; margin: 6px 0; }
  select, input[type=number] { background: #2a2a2a; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 3px; }
  input[type=number] { width: 60px; }
  button { background: #333; color: #fff; border: 0; border-radius: 4px; padding: 4px 9px; cursor: pointer; font: inherit; }
  button:hover { background: #e50914; }
  #words { max-height: 260px; overflow-y: auto; }
  .w { padding: 6px 0; border-bottom: 1px solid #2a2a2a; display: flex; gap: 6px; }
  .w div { flex: 1; }
  .w b { color: #fff; }
  .w .tr { color: #ffd76a; }
  .w .ctx { color: #888; font-style: italic; font-size: 12px; }
  .w button { align-self: flex-start; padding: 1px 6px; }
  .empty { color: #777; }
  .tools { display: flex; gap: 6px; }
</style>
</head>
<body>
  <h1>Stremio Reactor</h1>
  <label>J'apprends <select id="target"></select></label>
  <label>Ma langue <select id="native"></select></label>
  <label>Pause auto à chaque réplique <input type="checkbox" id="autoPause"></label>
  <label>Pause quand la souris survole <input type="checkbox" id="hoverPause"></label>
  <label>Afficher la traduction <input type="checkbox" id="showNative"></label>
  <label>Flouter la traduction (survol pour voir) <input type="checkbox" id="blurNative"></label>
  <label>Taille du texte (px) <input type="number" id="fontSize" min="14" max="64"></label>

  <h2><span>Mots sauvegardés (<span id="count">0</span>)</span>
    <span class="tools"><button id="export" title="CSV importable dans Anki">Export Anki</button><button id="clear">Vider</button></span>
  </h2>
  <div id="words"></div>
  <script src="lib/langs.js"></script>
  <script src="popup.js"></script>
</body>
</html>
